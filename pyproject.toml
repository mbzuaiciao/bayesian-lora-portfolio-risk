[project]
name = "bayesian-lora-portfolio-risk"
version = "0.1.0"
description = "Research code for Bayesian LoRA uncertainty on financial text and downstream portfolio risk decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "torch>=2.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesian_lora_portfolio_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
